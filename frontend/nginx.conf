server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none';" always;
    client_max_body_size 50m;

    # Compose DNS — avoid stale IPs after backend restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_api http://backend:8000;
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Citation PDF viewer (legacy static mount)
    location /files/ {
        proxy_pass http://backend:8000/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
